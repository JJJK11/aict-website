<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 115" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&amp;display=swap');
    </style>
    <linearGradient id="grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2559"/>
      <stop offset="40%" stop-color="#155199"/>
      <stop offset="100%" stop-color="#2B7BBE"/>
    </linearGradient>
  </defs>

  <!-- "A" uppercase -->
  <text x="48" y="80" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-size="95" font-weight="900" fill="url(#grad)">A</text>

  <!-- "i" lowercase — render full character then mask the dot -->
  <text x="116" y="80" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-size="95" font-weight="900" fill="url(#grad)">i</text>
  <!-- White cover over the i-dot -->
  <rect x="118" y="5" width="28" height="26" fill="white"/>

  <!-- Green checkmark replacing the i-dot -->
  <path d="M118,28 L131,42 L155,8" stroke="#6B9B2A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- "CT" uppercase -->
  <text x="148" y="80" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-size="95" font-weight="900" fill="url(#grad)">CT</text>

  <!-- Tagline -->
  <text x="200" y="105" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" letter-spacing="0.8" fill="#555555">Assessment  |  Inspection  |  Certification  |  Technology</text>
</svg>