<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56">
  <defs>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2463"/>
      <stop offset="100%" stop-color="#1e5fa8"/>
    </linearGradient>
  </defs>
  <!-- A -->
  <text x="0" y="44" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="url(#b)">A</text>
  <!-- i stem only (no dot - checkmark replaces it) -->
  <rect x="35" y="20" width="6" height="26" rx="1" fill="url(#b)"/>
  <!-- Green checkmark as the dot of the i -->
  <path d="M31 12 L37 18 L47 5" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- CT -->
  <text x="47" y="44" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="url(#b)">CT</text>
  <!-- Divider -->
  <line x1="118" y1="8" x2="118" y2="48" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Tagline -->
  <text x="128" y="24" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#0a2463">GLOBAL SERVICES</text>
  <text x="128" y="42" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="400" letter-spacing="1.2" fill="#64748b">Assessment | Inspection | Certification | Technology</text>
