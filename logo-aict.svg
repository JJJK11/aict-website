<svg xmlns="http://www.w3.org/2000/svg" width="200" height="28" viewBox="0 0 200 28">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&amp;display=swap');</style>
  </defs>

  <!-- Icon: 28x28 dark rounded square -->
  <rect width="28" height="28" rx="6" fill="#0F172A"/>

  <!-- White checkmark centered in icon -->
  <svg x="7" y="7" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 13 10 17 18 7"/>
  </svg>

  <!-- Text: AICT + Global Services -->
  <text x="38" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#0F172A" letter-spacing="-0.5">AICT<tspan font-size="12.5" font-weight="500" fill="#64748B" dx="3">Global Services</tspan></text>
</svg>
